name: Publish macOS v0.3.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-macos-v0.3.2.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Shine-musC4T/seoultech-lms-connector'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build macOS release ZIP
        shell: bash
        run: |
          release_root="$RUNNER_TEMP/seoultech-lms-connector-macos-v0.3.2"
          cp -a macos "$release_root"
          python "$release_root/scripts/package_release.py" \
            --source "$release_root" \
            --output "$RUNNER_TEMP/seoultech-lms-connector-macos-v0.3.2.zip"
          python "$release_root/scripts/verify_release.py" \
            --source "$release_root" \
            --archive "$RUNNER_TEMP/seoultech-lms-connector-macos-v0.3.2.zip"

      - name: Download unchanged Windows asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download v0.3.1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "seoultech-lms-connector-windows-v0.3.1.zip" \
            --dir "$RUNNER_TEMP"

      - name: Write release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          macOS 실기기 검사 피드백을 반영한 보안·안정성 개선 릴리즈입니다.

          ## macOS v0.3.2 변경사항

          - 공식 e-Class HTTPS 도메인과 읽기 전용 경로를 요청·리다이렉트마다 검증
          - 실제 LMS 로그인 성공을 확인한 뒤에만 세션 저장
          - 로그인 세션 폴더 700, 파일 600 권한 및 원자적 저장 적용
          - Playwright Chromium을 항상 준비하도록 설치 과정 보강
          - Claude Code MCP 등록 실패 시 기존 사용자 설정 자동 복원
          - 터미널용 deadlines --days 명령 추가
          - Claude Desktop MCPB의 시스템 Python 오탐 호환성 문제 수정
          - 배포 ZIP 검증 및 캐시·빌드 산출물 제외 강화

          Windows 배포본은 변경하지 않았으며 검증된 v0.3.1 파일을 함께 제공합니다.

          > 이 프로젝트는 서울과학기술대학교 또는 e-Class 운영사가 제작·승인한 공식 프로그램이 아닙니다. 중요한 시험·과제 정보는 e-Class 원문에서 최종 확인하세요.
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.3.2 \
            "$RUNNER_TEMP/seoultech-lms-connector-macos-v0.3.2.zip" \
            "$RUNNER_TEMP/seoultech-lms-connector-windows-v0.3.1.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target ed78254b00b0cb77aff83a323260c651ca793260 \
            --title "SeoulTech LMS Connector v0.3.2" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
