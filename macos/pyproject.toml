[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seoultech-lms-connector"
version = "0.3.2"
description = "Personal, read-only SeoulTech LMS connector"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "playwright>=1.49,<2", "beautifulsoup4>=4.12,<5", "mcp>=1.13,<2"]

[project.scripts]
seoultech-lms = "seoultech_lms.cli:main"
seoultech-lms-mcp = "seoultech_lms.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
